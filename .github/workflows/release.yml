name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # version inferred from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `setup-node` writes .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # so we must expose the npm token under that name too. Otherwise
          # npm publish sends the literal string "${NODE_AUTH_TOKEN}" as
          # the bearer token and the registry rejects it (manifests as 404
          # on PUT for first-time publishes).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_CONFIG_PROVENANCE intentionally NOT set: npm provenance
          # requires a public GitHub source repository. ampless's repo
          # is private during the pre-1.0 closed-development phase. When
          # the repo flips to public (around v1.0 RC), re-enable this.
