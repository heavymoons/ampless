name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # version inferred from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `setup-node` writes .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # so we must expose the npm token under that name too. Otherwise
          # npm publish sends the literal string "${NODE_AUTH_TOKEN}" as
          # the bearer token and the registry rejects it (manifests as 404
          # on PUT for first-time publishes).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance: enabled since the repo went public (beta flip,
          # 2026-06-11). Requires a public GitHub source repository and the
          # job-level `id-token: write` permission (already set above).
          NPM_CONFIG_PROVENANCE: 'true'

      # `changeset publish` (in pre-release mode for packages that have
      # never had a stable release) publishes to the `latest` dist tag
      # only, leaving the current pre-release dist-tag (`alpha` /
      # `beta` / ...) frozen at whatever it was before pre-mode started.
      # The sync script reads `.changeset/pre.json#tag` and re-asserts
      # `<that tag> = <current version>` for matching public workspace
      # packages (those whose `package.json` version prerelease
      # identifier matches the current pre-release tag), so e.g.
      # `npx <pkg>@alpha` (or `@beta`) keeps resolving to the current
      # pre-release.
      #
      # Gated on `changesets/action`'s `published` output so the sync
      # only fires when this run actually published something. Every
      # other main-branch push (feature merges where the action just
      # opens/updates the Version Packages PR) skips this step — keeps
      # the workflow quiet on non-release pushes and avoids touching
      # the npm dist-tag from runs that haven't bumped any version.
      - name: Sync dist-tag
        if: steps.changesets.outputs.published == 'true'
        # Re-write ~/.npmrc explicitly. After `changesets/action` runs,
        # the .npmrc written by `setup-node` (which references
        # `${NODE_AUTH_TOKEN}`) can be in a state where subsequent
        # `npm` calls hit E401 — symptom: this step fails for
        # newly-published versions while pre-check succeeds for ones
        # already at target. Writing a fresh `_authToken=<value>` line
        # restores auth deterministically.
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          node scripts/sync-dist-tag.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
