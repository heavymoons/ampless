packages:
  - "packages/*"

# pnpm 10+ blocks unapproved postinstall scripts by default. Map each
# package to true/false to opt in or out. The format is the one written
# by `pnpm approve-builds`.
#   - sharp: native image-processing binaries used by media uploads
#     (admin) and OG-image generation (plugin-og-image).
#   - esbuild: bundler binary used transitively by tsup / vitest.
# core-js stays off — its postinstall is just a thank-you message.
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true

# Force esbuild past the ranges declared by tsup / vite, which cap at
# 0.27.x. Dependabot alerts GHSA-gv7w-rqvm-qjhr (high) and
# GHSA-g7r4-m6w7-qqqr (low) are fixed in 0.28.1; drop this once tsup
# and vite bump their own esbuild dependency.
overrides:
  esbuild: ^0.28.1
